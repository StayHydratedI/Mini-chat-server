<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mini Chat Server</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #eef1f7 0%, #e6e9f2 100%);
    color: #1a1a1a;
    display: flex;
    justify-content: center;
    position: fixed;
    inset: 0;
  }

  #app {
    width: 100%;
    max-width: 600px;
    height: 100dvh; /* fallback; JS overrides this to the real visible height */
    display: flex;
    flex-direction: column;
    background: white;
  }

  /* ---- Join screen ---- */
  #joinScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px;
  }
  #joinScreen h2 { margin: 0 0 4px; font-size: 22px; }
  #joinScreen p { margin: 0 0 20px; font-size: 13px; color: #8a8f99; }
  #joinBox { display: flex; gap: 8px; }
  #joinBox input {
    flex: 1; min-width: 0; padding: 13px 14px; border: 1px solid #d8dae0;
    border-radius: 10px; font-size: 16px; background: #fafbfc;
  }
  #joinBox button {
    padding: 13px 20px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white; font-size: 15px; font-weight: 500; flex-shrink: 0;
  }

  /* ---- Chat screen ---- */
  #chatScreen {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }

  #topBar {
    padding: 12px 14px;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
  }
  #topBar h2 { margin: 0 0 2px; font-size: 17px; }
  #status { font-size: 12px; color: #8a8f99; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  #status .dot { width: 7px; height: 7px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; }
  #status.connected .dot { background: #22c55e; }
  #users { font-size: 11px; color: #6b7280; word-wrap: break-word; }

  #messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .system {
    color: #9aa0a8; font-style: italic; font-size: 12px;
    text-align: center; margin: 6px 0;
  }

  .bubble-row { display: flex; flex-direction: column; max-width: 80%; }
  .bubble-row.mine { align-self: flex-end; align-items: flex-end; }
  .bubble-row.theirs { align-self: flex-start; align-items: flex-start; }

  .bubble-name {
    font-size: 12px; font-weight: 700; margin-bottom: 2px; padding: 0 4px;
    background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .bubble {
    padding: 9px 13px; border-radius: 16px; font-size: 15px;
    line-height: 1.35; word-wrap: break-word; white-space: pre-wrap;
  }
  .bubble-row.mine .bubble {
    background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble-row.theirs .bubble {
    background: #f0f1f4; color: #1a1a1a;
    border-bottom-left-radius: 4px;
  }

  #emojiBar {
    display: none; gap: 4px; padding: 8px 10px; border-top: 1px solid #eee;
    background: #fafbfc; overflow-x: auto; white-space: nowrap; flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }
  #emojiBar.open { display: flex; }
  #emojiBar span {
    font-size: 24px; cursor: pointer; padding: 2px 5px;
    display: inline-block; transition: transform 0.1s; flex-shrink: 0;
  }
  #emojiBar span:active { transform: scale(1.3); }

  #inputRow {
    display: flex; align-items: center; gap: 8px; padding: 10px;
    border-top: 1px solid #eee; background: white; flex-shrink: 0;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  #inputRow input {
    flex: 1; min-width: 0; padding: 11px 14px; border: 1px solid #d8dae0;
    border-radius: 20px; font-size: 16px; background: #f7f8fa;
  }
  #inputRow input:focus { outline: none; border-color: #2563eb; background: white; }
  #emojiToggle, .sendBtn {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    border: none; cursor: pointer;
  }
  #emojiToggle { background: #f0f1f4; color: #444; }
  .sendBtn { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; }
  #emojiToggle:active, .sendBtn:active, #joinBox button:active { transform: scale(0.95); }

  @media (min-width: 601px) {
    body { padding: 30px 0; }
    #app { height: 90vh; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; }
  }
</style>
</head>
<body>
  <div id="app">

    <div id="joinScreen">
      <h2>Mini Chat Server</h2>
      <p>Real-time chat, no account needed.</p>
      <div id="joinBox">
        <input id="usernameInput" type="text" placeholder="Enter a username">
        <button onclick="joinChat()">Join</button>
      </div>
    </div>

    <div id="chatScreen">
      <div id="topBar">
        <h2>Mini Chat Server</h2>
        <div id="status"><span class="dot"></span><span id="statusText">Not connected</span></div>
        <div id="users">Online: —</div>
      </div>

      <div id="messages"></div>

      <div id="emojiBar">
        <span>😀</span><span>😂</span><span>😍</span><span>👍</span>
        <span>🙏</span><span>🔥</span><span>🎉</span><span>😢</span>
        <span>😮</span><span>❤️</span><span>😎</span><span>👀</span>
        <span>🤔</span><span>😴</span><span>🙌</span><span>💯</span>
      </div>

      <div id="inputRow">
        <button id="emojiToggle" onclick="toggleEmojiBar()">🙂</button>
        <input id="messageInput" type="text" placeholder="Type a message...">
        <button class="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>

  </div>

  <script>
    // Keep #app locked to the REAL visible viewport, even when the
    // on-screen keyboard opens (fixes content shifting/scrolling out of view)
    const appEl = document.getElementById("app");

    function fixViewportHeight() {
      if (window.innerWidth > 600) {
        appEl.style.height = ""; // let CSS (90vh + padding) handle desktop
        return;
      }
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      appEl.style.height = vh + "px";
      window.scrollTo(0, 0);
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", fixViewportHeight);
      window.visualViewport.addEventListener("scroll", fixViewportHeight);
    }
    window.addEventListener("resize", fixViewportHeight);
    fixViewportHeight();

    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const messagesEl = document.getElementById("messages");
    const usersEl = document.getElementById("users");
    const joinScreen = document.getElementById("joinScreen");
    const chatScreen = document.getElementById("chatScreen");
    const usernameInput = document.getElementById("usernameInput");
    const messageInput = document.getElementById("messageInput");
    const emojiBar = document.getElementById("emojiBar");

    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(`${protocol}//${location.host}`);
    let username = "";

    socket.onopen = () => {
      statusText.textContent = "Connected to server";
      statusEl.classList.add("connected");
    };
    socket.onclose = () => {
      statusText.textContent = "Disconnected";
      statusEl.classList.remove("connected");
    };

    // Give each username a consistent, distinct gradient color
    function gradientForName(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue1 = Math.abs(hash) % 360;
      const hue2 = (hue1 + 55) % 360;
      return `linear-gradient(90deg, hsl(${hue1}, 80%, 50%), hsl(${hue2}, 80%, 50%))`;
    }

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === "system") {
        const p = document.createElement("div");
        p.className = "system";
        p.textContent = data.message;
        messagesEl.appendChild(p);
      }

      if (data.type === "message") {
        const isMine = data.username === username;

        const row = document.createElement("div");
        row.className = "bubble-row " + (isMine ? "mine" : "theirs");

        if (!isMine) {
          const name = document.createElement("div");
          name.className = "bubble-name";
          name.textContent = data.username;
          name.style.backgroundImage = gradientForName(data.username);
          row.appendChild(name);
        }

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = data.message;
        row.appendChild(bubble);

        messagesEl.appendChild(row);
      }

      if (data.type === "userlist") {
        usersEl.textContent = "Online: " + data.users.join(", ");
      }

      messagesEl.scrollTop = messagesEl.scrollHeight;
    };

    function joinChat() {
      username = usernameInput.value.trim();
      if (!username) return;
      socket.send(JSON.stringify({ type: "join", username }));
      joinScreen.style.display = "none";
      chatScreen.style.display = "flex";
      messageInput.focus();
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      socket.send(JSON.stringify({ type: "message", message: text }));
      messageInput.value = "";
    }

    function toggleEmojiBar() {
      emojiBar.classList.toggle("open");
    }

    emojiBar.addEventListener("click", (e) => {
      if (e.target.tagName === "SPAN") {
        messageInput.value += e.target.textContent;
        messageInput.focus();
      }
    });

    usernameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") joinChat(); });
    messageInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

    messageInput.addEventListener("focus", () => {
      setTimeout(() => {
        fixViewportHeight();
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }, 300);
    });
  </script>
</body>
</html>
