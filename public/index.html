<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mini Chat Server</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 600px;
    width: 100%;
    margin: 40px auto;
    padding: 0 16px;
    background: linear-gradient(180deg, #eef1f7 0%, #e6e9f2 100%);
    color: #1a1a1a;
  }
  h2 { margin-bottom: 2px; font-size: 22px; }
  #status { font-size: 12px; color: #8a8f99; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; }
  #status.connected .dot { background: #22c55e; }

  #joinBox { display: flex; gap: 8px; margin-bottom: 14px; }
  #joinBox input {
    flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid #d8dae0;
    border-radius: 10px; font-size: 16px; background: white;
  }
  #joinBox button, #chatBox .sendBtn, #emojiToggle {
    border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white; font-size: 15px; font-weight: 500;
  }
  #joinBox button { padding: 12px 18px; }
  #joinBox button:active, .sendBtn:active, #emojiToggle:active { transform: scale(0.97); }

  #chatBox { display: none; }

  #card {
    background: white; border-radius: 14px; box-shadow: 0 2px 14px rgba(0,0,0,0.06);
    overflow: hidden; display: flex; flex-direction: column;
  }

  #users {
    font-size: 12px; color: #6b7280; padding: 10px 14px;
    border-bottom: 1px solid #eee; word-wrap: break-word; background: #fafbfc;
  }

  #messages {
    padding: 14px; overflow-y: auto; height: 340px;
    display: flex; flex-direction: column; gap: 6px;
  }

  .system {
    color: #9aa0a8; font-style: italic; font-size: 12px;
    text-align: center; margin: 6px 0;
  }

  .bubble-row { display: flex; flex-direction: column; max-width: 78%; }
  .bubble-row.mine { align-self: flex-end; align-items: flex-end; }
  .bubble-row.theirs { align-self: flex-start; align-items: flex-start; }

  .bubble-name { font-size: 11px; color: #6b7280; margin-bottom: 2px; padding: 0 4px; }

  .bubble {
    padding: 9px 13px; border-radius: 16px; font-size: 15px;
    line-height: 1.35; word-wrap: break-word; white-space: pre-wrap;
  }
  .bubble-row.mine .bubble {
    background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble-row.theirs .bubble {
    background: #f0f1f4; color: #1a1a1a;
    border-bottom-left-radius: 4px;
  }

  #emojiBar {
    display: none; gap: 6px; padding: 8px 10px; border-top: 1px solid #eee;
    background: #fafbfc; overflow-x: auto; white-space: nowrap;
  }
  #emojiBar.open { display: flex; }
  #emojiBar span {
    font-size: 22px; cursor: pointer; padding: 2px 4px;
    display: inline-block; transition: transform 0.1s;
  }
  #emojiBar span:active { transform: scale(1.3); }

  #inputRow {
    display: flex; gap: 8px; padding: 10px; border-top: 1px solid #eee;
    background: white;
  }
  #inputRow input {
    flex: 1; min-width: 0; padding: 11px 14px; border: 1px solid #d8dae0;
    border-radius: 20px; font-size: 16px; background: #f7f8fa;
  }
  #inputRow input:focus { outline: none; border-color: #2563eb; background: white; }
  #emojiToggle, .sendBtn {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  #emojiToggle { background: #f0f1f4; color: #444; }

  /* Phone screens */
  @media (max-width: 480px) {
    body { margin: 12px auto; padding: 0 8px; }
    h2 { font-size: 19px; }
    #messages { height: 58vh; }
    .bubble-row { max-width: 88%; }
  }
</style>
</head>
<body>
  <h2>Mini Chat Server</h2>
  <div id="status"><span class="dot"></span><span id="statusText">Not connected</span></div>

  <div id="joinBox">
    <input id="usernameInput" type="text" placeholder="Enter a username">
    <button onclick="joinChat()">Join</button>
  </div>

  <div id="chatBox">
    <div id="card">
      <div id="users">Online: —</div>
      <div id="messages"></div>
      <div id="emojiBar">
        <span>😀</span><span>😂</span><span>😍</span><span>👍</span>
        <span>🙏</span><span>🔥</span><span>🎉</span><span>😢</span>
        <span>😮</span><span>❤️</span><span>😎</span><span>👀</span>
        <span>🤔</span><span>😴</span><span>🙌</span><span>💯</span>
      </div>
      <div id="inputRow">
        <button id="emojiToggle" onclick="toggleEmojiBar()">🙂</button>
        <input id="messageInput" type="text" placeholder="Type a message...">
        <button class="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const messagesEl = document.getElementById("messages");
    const usersEl = document.getElementById("users");
    const joinBox = document.getElementById("joinBox");
    const chatBox = document.getElementById("chatBox");
    const usernameInput = document.getElementById("usernameInput");
    const messageInput = document.getElementById("messageInput");
    const emojiBar = document.getElementById("emojiBar");

    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(`${protocol}//${location.host}`);
    let username = "";

    socket.onopen = () => {
      statusText.textContent = "Connected to server";
      statusEl.classList.add("connected");
    };
    socket.onclose = () => {
      statusText.textContent = "Disconnected";
      statusEl.classList.remove("connected");
    };

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === "system") {
        const p = document.createElement("div");
        p.className = "system";
        p.textContent = data.message;
        messagesEl.appendChild(p);
      }

      if (data.type === "message") {
        const isMine = data.username === username;

        const row = document.createElement("div");
        row.className = "bubble-row " + (isMine ? "mine" : "theirs");

        if (!isMine) {
          const name = document.createElement("div");
          name.className = "bubble-name";
          name.textContent = data.username;
          row.appendChild(name);
        }

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = data.message;
        row.appendChild(bubble);

        messagesEl.appendChild(row);
      }

      if (data.type === "userlist") {
        usersEl.textContent = "Online: " + data.users.join(", ");
      }

      messagesEl.scrollTop = messagesEl.scrollHeight;
    };

    function joinChat() {
      username = usernameInput.value.trim();
      if (!username) return;
      socket.send(JSON.stringify({ type: "join", username }));
      joinBox.style.display = "none";
      chatBox.style.display = "block";
      messageInput.focus();
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      socket.send(JSON.stringify({ type: "message", message: text }));
      messageInput.value = "";
    }

    function toggleEmojiBar() {
      emojiBar.classList.toggle("open");
    }

    emojiBar.addEventListener("click", (e) => {
      if (e.target.tagName === "SPAN") {
        messageInput.value += e.target.textContent;
        messageInput.focus();
      }
    });

    usernameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") joinChat(); });
    messageInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
  </script>
</body>
</html>
